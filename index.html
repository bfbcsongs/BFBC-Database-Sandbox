<!DOCTYPE html>
<html lang="en">
<head>
    <!-- PWA Manifest & Mobile Icons -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BFBC Songs">
<link rel="apple-touch-icon" href="icon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFBC SONGS by paulm</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN (Official v2 Package) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <a href="#" class="flex items-center space-x-2.5">
                <i class="fa-solid fa-music text-indigo-400 text-xl"></i>
                <div class="flex flex-col">
                    <h1 class="text-lg font-bold tracking-wide text-white leading-tight">BFBC SONGS</h1>
                    <span class="text-[9px] text-slate-500 italic font-mono lowercase tracking-tight">created by paulm</span>
                </div>
            </a>
            <button id="add-song-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-md transition cursor-pointer">
                <i class="fa-solid fa-plus"></i> Add Song
            </button>
        </div>
    </header>

    <!-- Main Mobile Container -->
    <main class="max-w-md mx-auto px-4 py-4 space-y-4">

        <!-- Search Bar -->
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="search-input" placeholder="Search title or lyrics..." class="w-full bg-slate-800 border border-slate-700/80 rounded-xl pl-10 pr-3 py-2.5 text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition shadow-inner">
        </div>

        <!-- Special Folders & Actions -->
        <div class="flex items-center justify-between">
            <button id="new-folder-btn" class="w-full flex items-center justify-center gap-2 px-3 py-2 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-xl text-xs font-bold transition hover:bg-amber-500 hover:text-slate-900 cursor-pointer">
                <i class="fa-solid fa-folder-plus"></i> New Songs Folder
                <span id="new-count-badge" class="bg-amber-500 text-slate-950 px-2 py-0.5 rounded-full text-[10px] font-black">0</span>
            </button>
        </div>

        <!-- Mobile Portrait Optimized Grid (2 Columns, 3 Rows) -->
        <div class="space-y-1.5">
            <h2 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Categories</h2>
            <div class="grid grid-cols-2 gap-2">
                <button class="category-btn w-full px-3 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold border border-slate-700/60 hover:border-indigo-500/50 transition cursor-pointer flex items-center justify-center gap-2" data-category="Opening">
                    <i class="fa-solid fa-door-open text-indigo-400"></i> Opening
                </button>
                <button class="category-btn w-full px-3 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold border border-slate-700/60 hover:border-indigo-500/50 transition cursor-pointer flex items-center justify-center gap-2" data-category="Joyful">
                    <i class="fa-solid fa-face-smile text-amber-400"></i> Joyful
                </button>
                <button class="category-btn w-full px-3 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold border border-slate-700/60 hover:border-indigo-500/50 transition cursor-pointer flex items-center justify-center gap-2" data-category="Solemn">
                    <i class="fa-solid fa-hands-praying text-sky-400"></i> Solemn
                </button>
                <button class="category-btn w-full px-3 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold border border-slate-700/60 hover:border-indigo-500/50 transition cursor-pointer flex items-center justify-center gap-2" data-category="Offering">
                    <i class="fa-solid fa-hand-holding-heart text-emerald-400"></i> Offering
                </button>
                <button class="category-btn w-full px-3 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold border border-slate-700/60 hover:border-indigo-500/50 transition cursor-pointer flex items-center justify-center gap-2" data-category="Closing">
                    <i class="fa-solid fa-flag-checkered text-rose-400"></i> Closing
                </button>
                <button class="category-btn w-full px-3 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold border border-slate-700/60 hover:border-indigo-500/50 transition cursor-pointer flex items-center justify-center gap-2" data-category="Others">
                    <i class="fa-solid fa-ellipsis text-slate-400"></i> Others
                </button>
            </div>
        </div>

        <!-- Dynamic Songs List Section -->
        <div id="songs-container" class="space-y-3 pt-2">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <h2 id="list-header" class="font-bold text-base text-slate-200">All Songs</h2>
                <span id="song-count" class="text-xs font-medium text-slate-400">0 songs found</span>
            </div>
            <div id="songs-list" class="space-y-3">
                <!-- Song items render here -->
            </div>
        </div>

    </main>

    <!-- Modal for Adding / Editing Songs -->
    <div id="song-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 id="modal-title" class="text-base font-bold text-white">Add New Song</h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="song-form" class="space-y-3">
                <input type="hidden" id="song-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Song Title</label>
                    <input type="text" id="song-title-input" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Category</label>
                    <select id="song-category-input" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                        <option value="" disabled selected>Select Category...</option>
                        <option value="Opening">Opening</option>
                        <option value="Joyful">Joyful</option>
                        <option value="Solemn">Solemn</option>
                        <option value="Offering">Offering</option>
                        <option value="Closing">Closing</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Audio URL (Optional)</label>
                        <input type="text" id="song-audio-input" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Video URL (Optional)</label>
                        <input type="text" id="song-video-input" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Lyrics</label>
                    <textarea id="song-lyrics-input" rows="4" placeholder="Enter lyrics here..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white font-mono focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" id="cancel-modal-btn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-medium cursor-pointer">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold shadow-md cursor-pointer">Save Song</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
<!-- Service Worker Registration -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js?v=2', { scope: './' })
        .then(reg => console.log('SW registered!', reg))
        .catch(err => console.error('SW registration failed!', err));
    });
  }
</script>
</body>
</html>
